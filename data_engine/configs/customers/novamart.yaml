customer_id:
  source: client_ref
  required: true
first_name:
  source: customer_name
  required: true
  transformation: extract_first_name
last_name:
  source: customer_name
  required: true
  transformation: extract_last_name
email:
  source: contact_email
  required: true
phone:
  source: contact_number
  required: true
created_at:
  source: signup_date
  required: true
  format: '%Y-%m-%d'
